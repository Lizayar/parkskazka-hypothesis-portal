name = "parkskazka-hypothesis-edge"
main = "apps/edge/src/index.ts"
compatibility_date = "2026-08-12"

[vars]
READ_BACKEND = "d1"

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "parkskazka-hypotheses"
database_id = "34101c6d-5757-477b-93d8-97684506ce3c"
migrations_dir = "cloudflare/d1/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "f49845c5dc46467d88ff61d0bb60960e"

# R2 is intentionally enabled after the account-level R2 switch is turned on
# in Cloudflare Dashboard. Keep the binding commented until the bucket exists.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "parkskazka-hypothesis-assets"

