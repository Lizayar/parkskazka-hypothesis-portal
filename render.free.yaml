# Free preview profile. Worker/Cron are intentionally omitted because Render
# does not offer Free instances for those service types.
services:
  - type: web
    name: portal-web-free
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node apps/web/src/server.mjs
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: preview
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"

  - type: web
    name: portal-api-free
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node apps/api/src/server.mjs
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: preview
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "10000"
      - key: PORTAL_READ_BACKEND
        value: fixture
      - key: DATABASE_URL
        fromDatabase:
          name: portal-postgres-free
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: portal-kv-free
          property: connectionString

  - type: keyvalue
    name: portal-kv-free
    region: frankfurt
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: portal-postgres-free
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"

