services:
  - type: web
    name: portal-web
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node apps/web/src/server.mjs
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: API_BASE_URL
        fromService:
          type: web
          name: portal-api
          property: hostport

  - type: web
    name: portal-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node apps/api/src/server.mjs
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "10000"
      # Keep the deployable bridge on fixture reads until the compiled Postgres
      # route replaces the explicit 501 boundary in apps/api/src/server.mjs.
      - key: PORTAL_READ_BACKEND
        value: fixture
      - key: DATABASE_URL
        fromDatabase:
          name: portal-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: portal-kv
          property: connectionString
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: portal-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node apps/worker/src/worker.mjs
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: portal-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: portal-kv
          property: connectionString
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  - type: cron
    name: portal-sync-cron
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node apps/worker/src/sync-cron.mjs
    schedule: "0 * * * *"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: portal-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: portal-kv
          property: connectionString
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  - type: keyvalue
    name: portal-kv
    region: frankfurt
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: portal-postgres
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    connectionPool: pgbouncer

