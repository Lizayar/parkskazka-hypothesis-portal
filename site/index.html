<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Полный read-only аудит рекламного кабинета VK Парка Сказка" />
    <title>VK аудит · Парк Сказка</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23d9ff55'/%3E%3Cpath d='M14 17h9l9 26 9-26h9L36 49h-8z' fill='%2317211c'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">Read-only · VK Ads · 26.08.2026</p>
          <h1>Кабинет без слепых зон</h1>
          <p class="lede">Полная структура кампаний, групп и объявлений с фактическими CTA и предпросмотрами креативов.</p>
        </div>
        <div class="seal" aria-label="Статус аудита"><span>FULL</span><small>AUDIT</small></div>
      </header>

      <section id="summary" class="summary-grid" aria-label="Контрольные итоги"></section>

      <aside class="notice">
        <strong>Граница данных</strong>
        <span id="attribution-note">Загрузка…</span>
      </aside>

      <section class="workspace">
        <div class="toolbar">
          <div class="view-tabs" role="tablist" aria-label="Уровень отчёта">
            <button class="tab is-active" data-view="campaigns" role="tab">Кампании</button>
            <button class="tab" data-view="groups" role="tab">Группы</button>
            <button class="tab" data-view="ads" role="tab">Объявления</button>
          </div>
          <label class="search"><span>Поиск</span><input id="search" type="search" placeholder="Название или ID" /></label>
          <label><span>Статус</span><select id="status-filter"><option value="all">Все</option><option value="active">Транслируется</option><option value="inactive">Не транслируется</option></select></label>
          <label><span>Решение</span><select id="decision-filter"><option value="all">Все</option><option>оставить</option><option>переработать</option><option>остановить</option><option>протестировать повторно</option></select></label>
        </div>
        <div id="result-count" class="result-count" aria-live="polite"></div>
        <main id="content" tabindex="-1"></main>
      </section>
    </div>
    <template id="empty-template"><div class="empty"><strong>Нет совпадений</strong><span>Измените фильтры или поисковый запрос.</span></div></template>
    <script type="module" src="app.js"></script>
  </body>
</html>
