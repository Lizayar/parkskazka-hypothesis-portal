name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Secret-shaped value scan
        shell: bash
        run: |
          ! rg -n -P '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|-----BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY-----|password[ \t]*[:=][ \t]*(?!undefined|\[REDACTED\])[A-Za-z0-9+/=._-]{8,}|secret[ \t]*[:=][ \t]*(?!undefined|\[REDACTED\])[A-Za-z0-9+/=._-]{8,})' .

  browser-smoke:
    runs-on: ubuntu-latest
    needs: verify
    env:
      PLAYWRIGHT_AVAILABLE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Local service smoke fallback
        run: node tests/smoke/local-services-smoke.mjs
      - name: Optional Playwright browser smoke
        if: env.PLAYWRIGHT_AVAILABLE == 'true'
        run: pnpm exec playwright test

